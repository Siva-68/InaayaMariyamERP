version: "3.9"

services:
  mongo1:
    image: mongo:7.0
    container_name: hinaya_mongo
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./docker/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - hinaya_net

  # Replica set initializer (runs once then exits)
  mongo-init:
    image: mongo:7.0
    container_name: hinaya_mongo_init
    depends_on:
      mongo1:
        condition: service_healthy
    command: >
      mongosh --host mongo1:27017 --eval
      "try { rs.status(); print('RS already initialized'); } catch(e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo1:27017' }] }); print('RS initialized'); }"
    networks:
      - hinaya_net

networks:
  hinaya_net:
    driver: bridge

volumes:
  mongo_data:
